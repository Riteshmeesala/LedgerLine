spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ledgerline_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration

ledgerline:
  jwt:
    secret: ${JWT_SECRET:dev_mode_only_secret_key_at_least_32_bytes_long_abcdef123456}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

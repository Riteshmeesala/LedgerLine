spring:
  application:
    name: ledgerline
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

ledgerline:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:https://ledgerline.vercel.app}
  limits:
    max-minor-units: 10000000000
  rate-limit:
    enabled: true
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    auditor-password: ${SEED_AUDITOR_PASSWORD:}
    holder1-password: ${SEED_HOLDER1_PASSWORD:}
    holder2-password: ${SEED_HOLDER2_PASSWORD:}
